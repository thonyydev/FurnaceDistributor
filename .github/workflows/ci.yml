
name: Build and Test

on:
  pull_request:
    branches:
      - main
      - '26.2'
      - '1.21.1'
      - '1.20.2'

  push:
    branches:
      - main
      - '26.2'
      - '1.21.1'
      - '1.20.2'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Java version
        id: java
        shell: bash
        run: |
          BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

          case "$BRANCH" in
            26.2)
              JAVA_VERSION=25
              ;;
            1.21.1)
              JAVA_VERSION=21
              ;;
            1.20.2|main)
              JAVA_VERSION=17
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Java $JAVA_VERSION for $BRANCH"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: bash ./gradlew clean build --no-daemon --stacktrace