plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Required platform APIs.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Optional client integration; Mod Menu is neither required nor bundled in the production jar.
    compileOnly("com.terraformersmc:modmenu:$rootProject.modmenu_version") { transitive = false }

    common(project(':common')) { transitive = false }
    runtimeOnly files(rootProject.project(':common').sourceSets.main.output)
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

loom {
    mods {
        main { sourceSet sourceSets.main; sourceSet 'main', ':common' }
    }
}

processResources {
    def replaceProperties = [
            version                 : project.version,
            mod_id                  : rootProject.mod_id,
            mod_name                : rootProject.mod_name,
            mod_description         : rootProject.mod_description,
            mod_authors             : rootProject.mod_authors,
            mod_license             : rootProject.mod_license,
            minecraft_version       : rootProject.minecraft_version,
            fabric_loader_version   : rootProject.fabric_loader_version,
            fabric_api_version      : rootProject.fabric_api_version,
            architectury_api_version: rootProject.architectury_api_version,
    ]

    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

jar { archiveClassifier = 'dev' }
tasks.named('build') { dependsOn shadowJar }
