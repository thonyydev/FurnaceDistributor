plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API for NeoForge.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Optional integration; never bundled and never present in common/Fabric's classpaths.
    compileOnly('curse.maven:iron-furnaces-fabric-neoforge-1506700:8573189') { transitive = false }
    if (providers.gradleProperty('withIronFurnaces').getOrElse('false').toBoolean()) {
        localRuntime('curse.maven:iron-furnaces-fabric-neoforge-1506700:8573189') { transitive = false }
    }

    common(project(':common')) {
        transitive = false
    }
    runtimeOnly files(rootProject.project(':common').sourceSets.main.output)

    shadowBundle project(
            path: ':common',
            configuration: 'transformProductionNeoForge'
    )
}

loom {
    mods {
        main { sourceSet sourceSets.main; sourceSet 'main', ':common' }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_name", rootProject.mod_name
    inputs.property "mod_description", rootProject.mod_description
    inputs.property "mod_authors", rootProject.mod_authors
    inputs.property "mod_license", rootProject.mod_license
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "neoforge_version", rootProject.neoforge_version
    inputs.property "architectury_api_version", rootProject.architectury_api_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                "version": project.version,
                "mod_id": rootProject.mod_id,
                "mod_name": rootProject.mod_name,
                "mod_description": rootProject.mod_description,
                "mod_authors": rootProject.mod_authors,
                "mod_license": rootProject.mod_license,
                "minecraft_version": rootProject.minecraft_version,
                "neoforge_version": rootProject.neoforge_version,
                "architectury_api_version": rootProject.architectury_api_version,
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

jar { archiveClassifier = 'dev' }
tasks.named('build') { dependsOn shadowJar }

// Isolated test mod: never included in the production jar or normal development runs.
if (providers.gradleProperty('integrationTests').getOrElse('false').toBoolean()) {
    sourceSets {
        integrationTest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            furnacedistributor_tests { sourceSet sourceSets.integrationTest }
        }
        runs {
            integrationTest {
                server()
                forgeTemplate 'gameTestServer'
                source sourceSets.integrationTest
                runDir 'build/integration-run'
                property 'neoforge.enabledGameTestNamespaces', 'furnacedistributor_tests'
                property 'neoforge.enableGameTest', 'true'
                property 'furnacedistributor.tests.expectIron', providers.gradleProperty('withIronFurnaces').getOrElse('false')
            }
        }
    }
}
