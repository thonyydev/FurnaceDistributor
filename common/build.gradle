architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Regression checks use the existing Minecraft/Gson runtime; no extra test dependency is needed.
tasks.register('regressionTest', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.thonyy.furnacedistributor.logic.RegressionChecks'
    workingDir = layout.buildDirectory.dir('regression-run').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args rootProject.projectDir.absolutePath
}

tasks.named('check') {
    dependsOn regressionTest
}
